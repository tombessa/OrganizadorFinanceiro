server:
  port: ${PORT:8080}

spring:
  application:
    name: organizador-financeiro-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/organizadorfinanceiro}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: organizadorfinanceiro
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: organizadorfinanceiro
    schemas: organizadorfinanceiro
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
