services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: organizadorfinanceiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - organizadorfinanceiro_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d organizadorfinanceiro"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/organizadorfinanceiro
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${LOCAL_POSTGRES_PASSWORD}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  organizadorfinanceiro_data:
